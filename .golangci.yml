version: "2"

run:
  timeout: 5m
  go: "1.23"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: github.com/nidhi24rajput/marketpulse

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - misspell
    - godot
    - exhaustive
    - noctx
    - bodyclose
  settings:
    errcheck:
      check-type-assertions: true
    staticcheck:
      checks: ["all"]
    godot:
      exclude:
        - "^@"
    exhaustive:
      default-signifies-exhaustive: true

issues:
  exclude-rules:
    - path: "_test\\.go"
      linters: [errcheck]
    - path: "scripts/"
      linters: [godot]
    - linters: [godot]
      source: "^// @"
