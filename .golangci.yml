run:
  timeout: 5m
  go: "1.22"

linters:
  enable:
    - gofmt
    - goimports
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - ineffassign
    - unused
    - misspell
    - godot
    - exhaustive
    - noctx
    - bodyclose

linters-settings:
  goimports:
    local-prefixes: github.com/nidhi24rajput/marketpulse
  errcheck:
    check-type-assertions: true
  staticcheck:
    checks: ["all"]

issues:
  exclude-rules:
    - path: "_test\\.go"
      linters: [errcheck]
    - path: "scripts/"
      linters: [godot]
